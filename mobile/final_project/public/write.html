<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>글쓰기 · ECONOVA</title>
  <meta name="description" content="이코노바(ECONOVA) · 국내외 주식·경제 정보 통합 분석 플랫폼">
  <link rel="icon" href="/images/favicon.png" type="image/png">
  <script src="/js/theme-init.js"></script>
  <link rel="preload" href="/vendor/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="stylesheet" href="/css/board.css">
  <script defer src="/vendor/supabase.js"></script>
  <script type="module" src="/js/pages/write.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="content">
        <a class="back-link" id="back-link" href="/board">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          게시판
        </a>
        <p class="alert error" id="page-message" role="alert" hidden></p>

        <div class="write-grid" id="content" hidden>
          <section class="panel" aria-labelledby="page-title">
            <div class="panel-head">
              <h1 class="panel-title write-title" id="page-title">글쓰기</h1>
            </div>
            <form class="panel-body form" id="write-form" novalidate>
              <p class="draft-notice" id="draft-notice" role="status" hidden></p>
              <fieldset class="field">
                <legend class="field-legend">게시판</legend>
                <div class="board-picker" id="board-picker"></div>
              </fieldset>

              <div class="field">
                <label for="title">제목</label>
                <input class="input" id="title" maxlength="100" required autocomplete="off" aria-describedby="title-hint" placeholder="제목을 입력하세요">
                <p class="hint" id="title-hint" hidden></p>
              </div>

              <div class="field">
                <label for="stock-input">관련 종목 <span class="muted">(선택)</span></label>
                <div id="stock-field"></div>
              </div>

              <div class="field">
                <label for="body">내용</label>
                <textarea class="textarea write-body" id="body" maxlength="10000" required aria-describedby="body-hint" placeholder="투자 아이디어, 분석, 질문을 자유롭게 남겨 보세요."></textarea>
                <div class="field-foot">
                  <p class="hint" id="body-hint" hidden></p>
                  <span class="sm muted" id="body-len">0 / 10,000</span>
                </div>
              </div>

              <p class="alert" id="form-message" role="alert" hidden></p>
              <div class="write-actions">
                <a class="btn ghost" id="cancel-link" href="/board">취소</a>
                <button class="btn primary" id="submit-btn" type="submit">등록</button>
              </div>
            </form>
          </section>

          <aside class="panel write-guide" aria-labelledby="guide-title">
            <div class="panel-head"><h2 class="panel-title" id="guide-title">작성 가이드</h2></div>
            <ul class="panel-body rule-list">
              <li>근거(실적, 지표, 뉴스)와 함께 쓰면 더 좋은 토론이 돼요.</li>
              <li>관련 종목을 연결하면 종목 화면에서도 글이 보여요.</li>
              <li>매수·매도 권유, 리딩방 홍보, 개인정보는 올리지 마세요.</li>
              <li>투자 판단의 책임은 본인에게 있어요.</li>
            </ul>
          </aside>
        </div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>
</body>
</html>
