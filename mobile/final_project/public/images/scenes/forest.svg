<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMaxYMax slice">
  <!-- 안개 낀 침엽수 숲: 청록빛 아침 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc6c4"/>
      <stop offset="1" stop-color="#e3f0ec"/>
    </linearGradient>
    <radialGradient id="light" cx="0.8" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="16"/></filter>
    <!-- 나무 한 그루 -->
    <symbol id="pine" viewBox="0 0 40 120">
