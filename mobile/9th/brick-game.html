<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#bfe3ff">
    <title>벽돌깨기</title>
    <style>
      /* ===== 기본 설정 ===== */
      :root {
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: #2b3a67;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent; /* 모바일 터치 시 파란 하이라이트 제거 */
      }

      /* ===== 페이지 배경: 밝은 파스텔 그라데이션 ===== */
      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        overflow: hidden;
        background:
          radial-gradient(circle at 12% 12%, #fff6c9 0, transparent 34%),  /* 왼쪽 위 노란 빛 */
          radial-gradient(circle at 90% 85%, #ffd6ea 0, transparent 38%),  /* 오른쪽 아래 분홍 빛 */
          linear-gradient(160deg, #bfe3ff 0%, #d9ecff 45%, #e9ddff 100%);  /* 하늘색 → 연보라 */
        user-select: none;
        touch-action: none; /* 게임 중 화면 스크롤/확대 방지 */
      }

      /* ===== 배경 구름: 동그라미 3개를 겹쳐 구름 모양을 만든다 ===== */
      .cloud {
        position: fixed;
        z-index: 0;
        width: 150px;
        height: 46px;
        border-radius: 50px;
        background: rgb(255 255 255 / 75%);
        filter: blur(1px);
        animation: float 40s linear infinite; /* 왼쪽 → 오른쪽으로 천천히 이동 */
      }

      .cloud::before,
      .cloud::after {
        position: absolute;
        content: "";
        border-radius: 50%;
        background: inherit;
      }

      .cloud::before { top: -22px; left: 24px; width: 62px; height: 62px; } /* 큰 뭉게구름 */
      .cloud::after  { top: -14px; left: 70px; width: 48px; height: 48px; } /* 작은 뭉게구름 */

      /* 구름마다 높이·속도·크기를 다르게 해서 자연스럽게 */
      .cloud:nth-child(1) { top: 9%;  left: -200px; }
      .cloud:nth-child(2) { top: 40%; left: -200px; animation-duration: 60s; animation-delay: -25s; transform: scale(0.7); }
      .cloud:nth-child(3) { top: 78%; left: -200px; animation-duration: 50s; animation-delay: -10s; transform: scale(1.2); }

      @keyframes float {
        to { translate: calc(100vw + 400px) 0; } /* 화면 밖까지 이동 */
      }

      /* ===== 게임 전체 영역 (HUD + 보드) ===== */
      .game {
        position: relative;
        z-index: 1;
        /* 가로 460px 이하, 세로로도 화면에 맞게 줄어들도록 폭 제한 */
        width: min(100%, 460px, calc((100svh - 32px) * 0.72));
      }

      /* ===== 상단 정보 표시줄 (점수/레벨/목숨/최고기록) ===== */
      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        padding: 10px 16px;
        border-radius: 18px;
        background: rgb(255 255 255 / 80%);
        box-shadow: 0 6px 20px rgb(90 120 200 / 18%);
        font-weight: 800;
      }

      .hud small {
        display: block;
        color: #7e8fc0;
        font-size: 0.66rem;
        letter-spacing: 0.06em;
      }

      .hud b {
        font-size: 1.15rem;
        font-variant-numeric: tabular-nums; /* 숫자 폭을 같게 해서 흔들림 방지 */
      }

      .lives {
        color: #ff5d7a; /* 하트 색 */
        letter-spacing: 2px;
      }

      /* ===== 게임 보드(캔버스를 감싸는 흰 테두리 카드) ===== */
      .board {
        position: relative; /* 안쪽 오버레이의 기준 */
        border: 5px solid #fff;
        border-radius: 24px;
        background: linear-gradient(180deg, #fffdf6, #eef6ff);
        box-shadow: 0 14px 40px rgb(90 120 200 / 28%);
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 480 / 640; /* 게임 내부 좌표(480x640)와 같은 비율 유지 */
      }

      /* ===== 오버레이: 시작/일시정지/클리어/게임오버 때 보이는 안내 창 ===== */
      .overlay {
        position: absolute;
        inset: 0; /* 보드 전체를 덮는다 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 24px;
        background: rgb(255 255 255 / 72%);
        backdrop-filter: blur(5px);
        text-align: center;
      }

      .overlay[hidden] {
        display: none; /* hidden 속성이 flex 때문에 무시되는 것을 방지 */
      }

      /* 제목은 무지개 그라데이션 글자 */
      .overlay h1 {
        margin: 0;
        font-size: clamp(2rem, 9vw, 2.6rem);
        letter-spacing: -0.04em;
        background: linear-gradient(90deg, #ff6b81, #ffa94d, #69c46d, #4dabf7, #9775fa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .overlay p {
        margin: 0;
        color: #5c6c9c;
        line-height: 1.6;
      }

      /* 입체감 있는 둥근 버튼 (아래쪽 그림자가 두께처럼 보임) */
      .overlay button {
        margin-top: 14px;
        padding: 14px 34px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff8fa3, #ff6b81);
        color: #fff;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 8px 0 #e04861, 0 12px 22px rgb(255 107 129 / 35%);
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .overlay button:hover  { transform: translateY(-2px); }
      .overlay button:active { transform: translateY(5px); box-shadow: 0 3px 0 #e04861; } /* 눌리는 느낌 */

      /* 조작 방법 안내 문구 */
      .hint {
        margin: 10px 0 0;
        color: #5c6c9c;
        font-size: 0.8rem;
        text-align: center;
      }

      /* 일시정지 버튼 */
      .pause-btn {
        padding: 6px 12px;
        border: 0;
        border-radius: 12px;
        background: #e6efff;
        color: #4a5c94;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- 배경 구름 3개 (모양/움직임은 CSS가 담당) -->
    <span class="cloud"></span><span class="cloud"></span><span class="cloud"></span>

    <div class="game">
      <!-- 상단 정보 표시줄: 값은 JS의 updateHud()가 채운다 -->
      <div class="hud">
        <div><small>SCORE</small><b id="score">0</b></div>
        <div><small>LEVEL</small><b id="level">1</b></div>
        <div><small>LIVES</small><b id="lives" class="lives">♥♥♥</b></div>
        <div><small>BEST</small><b id="best">0</b></div>
        <button id="pause" class="pause-btn" type="button" aria-label="일시정지">Ⅱ</button>
      </div>

      <div class="board">
        <!-- 실제 게임이 그려지는 캔버스 (내부 해상도 480x640) -->
        <canvas id="game" width="480" height="640"></canvas>

        <!-- 시작/정지/클리어/게임오버 안내 창 (내용은 showOverlay()로 바뀜) -->
        <div id="overlay" class="overlay">
          <h1 id="ov-title">벽돌깨기</h1>
          <p id="ov-text">패들을 움직여 공을 튕기고<br>모든 벽돌을 깨 보세요!</p>
          <button id="ov-btn" type="button">게임 시작</button>
        </div>
      </div>
      <p class="hint">마우스·터치 드래그 또는 ← → 로 이동 · 클릭/스페이스로 발사 · P 일시정지</p>
    </div>

    <script>
      /* =====================================================
       * 1. 상수와 DOM 요소
       * ===================================================== */

      // 게임 내부 좌표계 크기. 화면에는 CSS로 늘려서 보여주므로 좌표는 항상 이 값 기준.
      const W = 480, H = 640;
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");

      // 자주 쓰는 HTML 요소를 한 곳에 모아 둔다
      const el = {
        score: document.querySelector("#score"),
        level: document.querySelector("#level"),
        lives: document.querySelector("#lives"),
        best: document.querySelector("#best"),
        overlay: document.querySelector("#overlay"),
        title: document.querySelector("#ov-title"),
        text: document.querySelector("#ov-text"),
        btn: document.querySelector("#ov-btn"),
        pause: document.querySelector("#pause"),
      };

      // 벽돌 색상 팔레트 (줄마다 하나씩 돌아가며 사용)
      const COLORS = ["#ff6b81", "#ffa94d", "#ffd43b", "#69db7c", "#38d9a9", "#4dabf7", "#9775fa", "#f783ac", "#74c0fc"];

      // 벽돌 배치: 가로 8칸, 좌우 여백 22, 칸 사이 간격 6, 맨 위 여백 60, 벽돌 높이 24
      const COLS = 8, MARGIN = 22, GAP = 6, TOP = 60, BH = 24;
      // 벽돌 가로 폭 = (전체 폭 - 좌우 여백 - 칸 사이 간격 합) / 칸 수
      const BW = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;

      // 패들의 세로 위치/두께, 공의 반지름
      const PADDLE_Y = H - 50, PADDLE_H = 14, BALL_R = 8;

      /* =====================================================
       * 2. 게임 상태 변수
       * ===================================================== */

      // 게임 진행 단계:
      //  menu(시작 화면) → ready(공이 패들에 붙어 대기) → playing(진행 중)
      //  paused(일시정지) / over(게임 오버) / clear(레벨 클리어)
      let state = "menu";

      let score = 0, level = 1, lives = 3;
      let best = Number(localStorage.getItem("brick-best")) || 0; // 최고 점수는 브라우저에 저장

      let bricks = [];     // 남아 있는 벽돌들
      let balls = [];      // 현재 공들 (멀티볼 아이템이면 여러 개)
      let drops = [];      // 떨어지는 아이템들
      let particles = [];  // 벽돌 깨질 때 튀는 조각들 (효과용)

      // paddle.w = 현재 폭, paddle.targetW = 목표 폭 (아이템 먹으면 목표만 바꾸고 부드럽게 변화)
      let paddle = { x: W / 2, w: 90, targetW: 90 };
      let wideTimer = 0;   // '넓은 패들' 아이템 남은 시간(초)
      let shake = 0;       // 화면 흔들림 세기
      let keys = {};       // 현재 눌려 있는 키 목록

      el.best.textContent = best;

      /* =====================================================
       * 3. 레벨 / 게임 시작 관련 함수
       * ===================================================== */

      // n번째 레벨의 벽돌 배치를 만든다
      function buildLevel(n) {
        const rows = Math.min(4 + n, 9);  // 레벨이 오를수록 줄이 늘어남 (최대 9줄)
        const pattern = n % 3;            // 레벨마다 모양을 바꾸기 위한 값
        bricks = [];
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < COLS; c++) {
            // 패턴 0 (2레벨 이상): 체크무늬로 구멍을 낸다
            if (pattern === 0 && n > 1 && (r + c) % 2) continue;
            // 패턴 2: 아래쪽 왼쪽 모서리를 비워 계단 모양으로
            if (pattern === 2 && c < r / 2 - 1 && r > 5) continue;
            bricks.push({
              x: MARGIN + c * (BW + GAP),
              y: TOP + r * (BH + GAP),
              hp: r < Math.floor(n / 2) ? 2 : 1, // 위쪽 줄은 레벨이 오르면 2번 맞아야 깨짐
              color: COLORS[(r + n) % COLORS.length],
              pop: 0,                            // 맞았을 때 커졌다 돌아오는 애니메이션 값
            });
          }
        }
      }

      // 레벨이 오를수록 공이 빨라진다 (초당 픽셀)
      function ballSpeed() { return 330 + level * 22; }

      // 공을 패들 위에 올려놓고 발사 대기 상태로 만든다
      function resetBall() {
        balls = [{ x: paddle.x, y: PADDLE_Y - BALL_R - 1, vx: 0, vy: 0, stuck: true }];
        drops = [];
        state = "ready";
      }

      // 처음부터 새 게임 시작
      function newGame() {
        score = 0; level = 1; lives = 3;
        wideTimer = 0; paddle.targetW = paddle.w = 90;
        buildLevel(level);
        resetBall();
        hideOverlay();
        updateHud();
      }

      // 다음 레벨로 이동 (점수와 목숨은 유지)
      function nextLevel() {
        level++;
        buildLevel(level);
        resetBall();
        hideOverlay();
        updateHud();
      }

      // 대기 중인 공을 위쪽으로 발사 (살짝 랜덤한 각도)
      function launch() {
        if (state === "ready") {
          const b = balls[0];
          const a = (Math.random() * 0.5 - 0.25); // -0.25 ~ 0.25 라디안
          b.vx = Math.sin(a) * ballSpeed();
          b.vy = -Math.cos(a) * ballSpeed();      // 음수 = 위쪽
          b.stuck = false;
          state = "playing";
        }
      }

      /* =====================================================
       * 4. 화면 UI 갱신 (오버레이, HUD)
       * ===================================================== */

      // 안내 창을 보여준다 (제목/본문/버튼 글자를 지정)
      function showOverlay(title, text, btn) {
        el.title.textContent = title;
        el.text.innerHTML = text;
        el.btn.textContent = btn;
        el.overlay.hidden = false;
      }
      function hideOverlay() { el.overlay.hidden = true; }

      // 상단 점수판을 최신 값으로 갱신하고, 최고 점수를 저장한다
      function updateHud() {
        el.score.textContent = score;
        el.level.textContent = level;
        el.lives.textContent = "♥".repeat(Math.max(lives, 0)) || "–";
        if (score > best) {
          best = score;
          localStorage.setItem("brick-best", best);
        }
        el.best.textContent = best;
      }

      /* =====================================================
       * 5. 벽돌 / 아이템 / 효과 처리
       * ===================================================== */

      // 벽돌이 깨질 때 사방으로 튀는 조각(파티클) n개 생성
      function burst(x, y, color, n = 10) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * 6.283, s = 60 + Math.random() * 180; // 랜덤 방향/속도
          particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.6, max: 0.6, color, r: 2 + Math.random() * 3 });
        }
      }

      // 공이 벽돌에 맞았을 때 처리
      function hitBrick(b) {
        b.hp--;
        b.pop = 1; // 통통 튀는 애니메이션 시작
        if (b.hp > 0) { score += 5; return; } // 아직 안 깨졌으면 작은 점수만

        score += 10 * level;                  // 깨졌으면 레벨 비례 점수
        bricks.splice(bricks.indexOf(b), 1);  // 목록에서 제거
        burst(b.x + BW / 2, b.y + BH / 2, b.color);

        // 18% 확률로 아이템 떨어뜨리기 (멀티볼이 나올 확률을 더 높게 중복 배치)
        if (Math.random() < 0.18) {
          const types = ["wide", "multi", "multi", "life"];
          drops.push({ x: b.x + BW / 2, y: b.y, type: types[(Math.random() * types.length) | 0] });
        }
      }

      // 패들로 받은 아이템의 효과 적용
      function applyDrop(type) {
        if (type === "wide") {
          wideTimer = 12;       // 12초 동안
          paddle.targetW = 150; // 패들 확대
        } else if (type === "life") {
          lives = Math.min(lives + 1, 5); // 목숨 +1 (최대 5)
        } else if (type === "multi") {
          // 날아가는 공 하나를 기준으로 좌우 각도가 다른 공 2개를 추가
          const src = balls.find((b) => !b.stuck) || balls[0];
          if (!src.stuck) {
            for (const d of [-0.5, 0.5]) {
              const sp = Math.hypot(src.vx, src.vy), a = Math.atan2(src.vy, src.vx) + d;
              balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, stuck: false });
            }
          }
        }
        score += 20; // 아이템을 먹으면 보너스 점수
        updateHud();
      }

      /* =====================================================
       * 6. 공 이동과 충돌 처리
       * ===================================================== */

      // 공 하나를 dt초만큼 움직이고 벽/패들/벽돌과의 충돌을 처리한다.
      // 빠른 공이 벽돌을 뚫고 지나가지 않도록 작은 걸음(step)으로 나누어 이동한다.
      function stepBall(b, dt) {
        const dist = Math.hypot(b.vx, b.vy) * dt;                    // 이번 프레임 이동 거리
        const steps = Math.max(1, Math.ceil(dist / (BALL_R * 0.8))); // 공 반지름보다 작게 쪼갬
        const sdt = dt / steps;
        for (let i = 0; i < steps; i++) {
          b.x += b.vx * sdt;
          b.y += b.vy * sdt;

          // --- 벽 반사 (왼쪽/오른쪽/위쪽. 아래쪽은 반사 없이 공을 잃음) ---
          if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
          if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); }
          if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); }

          // --- 패들 충돌: 아래로 내려오는 공이 패들 영역에 닿았을 때 ---
          const px = paddle.x - paddle.w / 2;
          if (b.vy > 0 && b.y + BALL_R >= PADDLE_Y && b.y - BALL_R <= PADDLE_Y + PADDLE_H &&
              b.x >= px - BALL_R && b.x <= px + paddle.w + BALL_R) {
            // 패들 중앙에서 얼마나 벗어났는지(-1 ~ 1)로 반사 각도를 정한다
            const t = Math.max(-1, Math.min(1, (b.x - paddle.x) / (paddle.w / 2)));
            const sp = Math.min(Math.hypot(b.vx, b.vy) * 1.01, 720); // 맞을 때마다 살짝 가속 (최대 720)
            const a = t * 1.05;                                      // 가장자리일수록 비스듬하게
            b.vx = Math.sin(a) * sp;
            b.vy = -Math.cos(a) * sp;
            b.y = PADDLE_Y - BALL_R; // 패들 안에 파묻히지 않게 위로 밀어냄
            shake = 3;               // 살짝 화면 흔들기
          }

          // --- 벽돌 충돌: 원(공)과 사각형(벽돌) 충돌 검사 ---
          for (const br of bricks) {
            // 벽돌 위에서 공 중심과 가장 가까운 점을 찾는다
            const cx = Math.max(br.x, Math.min(b.x, br.x + BW));
            const cy = Math.max(br.y, Math.min(b.y, br.y + BH));
            const dx = b.x - cx, dy = b.y - cy;
            if (dx * dx + dy * dy > BALL_R * BALL_R) continue; // 닿지 않았으면 다음 벽돌
            // 가로로 더 많이 겹쳤으면 좌우 면에 부딪힌 것, 아니면 위아래 면
            if (Math.abs(dx) > Math.abs(dy)) {
              b.vx = Math.abs(b.vx) * (dx < 0 ? -1 : 1);
              b.x += dx < 0 ? -1 : 1;
            } else {
              b.vy = Math.abs(b.vy) * (dy < 0 ? -1 : 1);
              b.y += dy < 0 ? -1 : 1;
            }
            hitBrick(br);
            updateHud();
            break; // 한 걸음에 벽돌 하나만 처리 (이중 반사 방지)
          }
        }
      }

      /* =====================================================
       * 7. 매 프레임 갱신 (update)
       * ===================================================== */

      // dt = 지난 프레임 이후 흐른 시간(초)
      function update(dt) {
        // 키보드로 패들 이동 (← → 또는 A D)
        const move = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
        if (move) setPaddle(paddle.x + move * 520 * dt);

        // 패들 폭이 목표 폭으로 부드럽게 변하고, 아이템 시간이 끝나면 원래 크기로
        paddle.w += (paddle.targetW - paddle.w) * Math.min(1, dt * 10);
        if (wideTimer > 0 && (wideTimer -= dt) <= 0) paddle.targetW = 90;
        setPaddle(paddle.x); // 폭이 바뀌어도 화면 밖으로 안 나가게 다시 보정

        // 효과들 갱신: 벽돌 팝, 화면 흔들림, 파티클(중력 포함)
        for (const br of bricks) br.pop = Math.max(0, br.pop - dt * 6);
        shake = Math.max(0, shake - dt * 30);
        particles = particles.filter((p) => (p.life -= dt) > 0);
        for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }

        // 발사 대기 중에는 공이 패들을 따라다닌다
        if (state === "ready") {
          balls[0].x = paddle.x;
          return;
        }
        if (state !== "playing") return; // 진행 중이 아니면 아래 로직은 건너뜀

        // 모든 공 이동 + 화면 아래로 떨어진 공 제거
        for (const b of balls) stepBall(b, dt);
        balls = balls.filter((b) => b.y - BALL_R < H);

        // 아이템 낙하 및 패들과의 접촉 확인
        for (const d of drops) {
          d.y += 140 * dt;
          const px = paddle.x - paddle.w / 2;
          if (!d.done && d.y > PADDLE_Y - 10 && d.y < PADDLE_Y + PADDLE_H + 10 && d.x > px - 12 && d.x < px + paddle.w + 12) {
            d.done = true;
            applyDrop(d.type);
          }
        }
        drops = drops.filter((d) => !d.done && d.y < H + 20); // 먹었거나 화면 밖이면 제거

        // 공이 모두 사라졌다면 목숨 차감 → 게임 오버 또는 재도전
        if (!balls.length) {
          lives--;
          updateHud();
          if (lives <= 0) {
            state = "over";
            showOverlay("게임 오버", `점수 <b>${score}</b> · 최고 <b>${best}</b>`, "다시 도전");
          } else {
            resetBall();
          }
        // 벽돌이 모두 사라졌다면 레벨 클리어
        } else if (!bricks.length) {
          state = "clear";
          score += 100 * level; // 클리어 보너스
          updateHud();
          showOverlay(`레벨 ${level} 클리어!`, `점수 <b>${score}</b><br>다음 판은 조금 더 어려워져요`, "다음 레벨");
        }
      }

      /* =====================================================
       * 8. 그리기 (draw)
       * ===================================================== */

      // 둥근 사각형 경로 만들기 (이후 fill/stroke 로 칠함)
      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);
        if (shake) ctx.translate(0, shake * 0.6); // 흔들림 효과

        // 배경의 연한 격자무늬
        ctx.strokeStyle = "rgb(120 150 220 / 8%)";
        ctx.lineWidth = 1;
        for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
        for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

        // --- 벽돌: 그림자 → 본체 색 → 위쪽 하이라이트 → (체력 2면) 흰 테두리 ---
        for (const b of bricks) {
          const s = 1 + b.pop * 0.12; // 맞은 직후 살짝 커졌다가 원래대로
          const cx = b.x + BW / 2, cy = b.y + BH / 2;
          ctx.save();
          ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); // 벽돌 중심 기준 확대
          ctx.fillStyle = "rgb(60 80 140 / 18%)";
          rr(b.x, b.y + 3, BW, BH, 7); ctx.fill();            // 그림자
          ctx.fillStyle = b.color;
          rr(b.x, b.y, BW, BH, 7); ctx.fill();                // 본체
          const g = ctx.createLinearGradient(0, b.y, 0, b.y + BH);
          g.addColorStop(0, "rgb(255 255 255 / 55%)");
          g.addColorStop(0.5, "rgb(255 255 255 / 0%)");
          ctx.fillStyle = g;
          rr(b.x, b.y, BW, BH, 7); ctx.fill();                // 윗면 반짝임
          if (b.hp > 1) {                                     // 단단한 벽돌 표시
            ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5;
            rr(b.x + 3, b.y + 3, BW - 6, BH - 6, 5); ctx.stroke();
          }
          ctx.restore();
        }

        // --- 떨어지는 아이템: 색깔 캡슐 + 글자 (W: 넓은 패들, M: 멀티볼, ♥: 목숨) ---
        for (const d of drops) {
          const col = { wide: "#4dabf7", multi: "#ffa94d", life: "#ff6b81" }[d.type];
          const label = { wide: "W", multi: "M", life: "♥" }[d.type];
          ctx.fillStyle = col;
          rr(d.x - 14, d.y - 10, 28, 20, 10); ctx.fill();
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();
          ctx.fillStyle = "#fff"; ctx.font = "800 13px sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(label, d.x, d.y + 1);
        }

        // --- 패들: 그림자 → 그라데이션 본체 → 윗면 하이라이트 ---
        const px = paddle.x - paddle.w / 2;
        ctx.fillStyle = "rgb(60 80 140 / 20%)";
        rr(px, PADDLE_Y + 4, paddle.w, PADDLE_H, 8); ctx.fill();
        const pg = ctx.createLinearGradient(0, PADDLE_Y, 0, PADDLE_Y + PADDLE_H);
        pg.addColorStop(0, "#ff9aa9"); pg.addColorStop(1, "#ff5d7a");
        ctx.fillStyle = pg;
        rr(px, PADDLE_Y, paddle.w, PADDLE_H, 8); ctx.fill();
        ctx.fillStyle = "rgb(255 255 255 / 55%)";
        rr(px + 6, PADDLE_Y + 2, paddle.w - 12, 3, 2); ctx.fill();

        // --- 공: 그림자 + 입체감 나는 노란색 방사형 그라데이션 ---
        for (const b of balls) {
          ctx.fillStyle = "rgb(60 80 140 / 18%)";
          ctx.beginPath(); ctx.arc(b.x + 2, b.y + 4, BALL_R, 0, 6.283); ctx.fill();
          const g = ctx.createRadialGradient(b.x - 3, b.y - 3, 1, b.x, b.y, BALL_R);
          g.addColorStop(0, "#fff"); g.addColorStop(0.4, "#ffe066"); g.addColorStop(1, "#ffa94d");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, 6.283); ctx.fill();
        }

        // --- 파티클: 수명이 줄수록 투명해진다 ---
        for (const p of particles) {
          ctx.globalAlpha = p.life / p.max;
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
        }
        ctx.globalAlpha = 1;

        // 발사 대기 중 안내 문구
        if (state === "ready") {
          ctx.fillStyle = "rgb(74 92 148 / 75%)";
          ctx.font = "800 16px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("탭 / 스페이스로 발사!", W / 2, PADDLE_Y - 60);
        }
        ctx.restore();
      }

      /* =====================================================
       * 9. 입력 처리 (마우스 / 터치 / 키보드)
       * ===================================================== */

      // 패들 위치를 화면 안으로 제한해서 설정
      function setPaddle(x) {
        paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, x));
      }

      // 포인터의 화면 좌표를 게임 내부 좌표(0~480)로 변환
      function pointerX(e) {
        const r = canvas.getBoundingClientRect();
        return ((e.clientX - r.left) / r.width) * W;
      }

      // 마우스 이동·터치 드래그: 패들이 포인터를 따라간다
      canvas.addEventListener("pointermove", (e) => { if (state === "ready" || state === "playing") setPaddle(pointerX(e)); });
      // 클릭·탭: 패들 이동 + 대기 중이면 발사
      canvas.addEventListener("pointerdown", (e) => {
        if (state === "ready" || state === "playing") setPaddle(pointerX(e));
        launch();
      });

      addEventListener("keydown", (e) => {
        keys[e.key] = true;
        // 스페이스: 대기 중엔 발사, 그 외엔 일시정지 토글
        if (e.key === " ") { e.preventDefault(); state === "ready" ? launch() : togglePause(); }
        if (e.key === "p" || e.key === "P") togglePause();
      });
      addEventListener("keyup", (e) => { keys[e.key] = false; });
      // 다른 창으로 이동하면 자동 일시정지
      addEventListener("blur", () => { if (state === "playing") togglePause(); });

      // 일시정지 ↔ 계속하기
      function togglePause() {
        if (state === "playing") {
          state = "paused";
          showOverlay("일시정지", "잠깐 쉬어가요 ☁️", "계속하기");
        } else if (state === "paused") {
          state = "playing";
          hideOverlay();
        }
      }

      el.pause.addEventListener("click", togglePause);
      // 오버레이 버튼: 상태에 따라 계속하기 / 다음 레벨 / 새 게임
      el.btn.addEventListener("click", () => {
        if (state === "paused") togglePause();
        else if (state === "clear") nextLevel();
        else newGame();
      });

      /* =====================================================
       * 10. 게임 루프와 시작
       * ===================================================== */

      let last = performance.now();
      function loop(now) {
        // 프레임 간격(초). 탭 전환 등으로 너무 커지지 않게 0.033초로 제한
        const dt = Math.min(0.033, (now - last) / 1000);
        last = now;
        update(dt);  // 상태 갱신
        draw();      // 화면 그리기
        requestAnimationFrame(loop); // 다음 프레임 예약
      }

      // 시작 화면 뒤에 보일 첫 레벨을 미리 만들어 두고 루프 시작
      buildLevel(1);
      resetBall();
      state = "menu";
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
