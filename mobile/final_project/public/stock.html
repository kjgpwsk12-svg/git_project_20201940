<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>종목 · 이코노바</title>
  <meta name="description" content="이코노바(ECONOVA) · 국내외 주식·경제 정보 통합 분석 플랫폼">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/pages.css">
  <script defer src="/vendor/supabase.js"></script>
  <script type="module" src="/js/pages/stock.js"></script>
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>
    <div class="app-main">
      <header id="topbar"></header>
      <main id="main" class="content">
        <p class="alert error" id="stock-error" role="alert" hidden></p>

        <div id="stock" hidden>
          <div class="quote-head">
            <div>
              <p class="quote-id" id="quote-id"></p>
              <h1 class="quote-name" id="quote-name"></h1>
              <p class="quote-price">
                <strong class="price" id="quote-price"></strong>
                <span id="quote-change"></span>
              </p>
              <p class="xs muted" id="quote-time" style="margin-top:4px"></p>
            </div>
            <div class="quote-actions">
              <button class="btn outline star-btn" id="watch-toggle" type="button" aria-pressed="false"></button>
            </div>
          </div>

          <dl class="panel stats-strip" id="stats"></dl>

          <div class="grid grid-main">
            <section class="panel" aria-labelledby="chart-title">
              <div class="panel-head">
                <h2 class="panel-title" id="chart-title">가격 차트</h2>
                <p class="chart-legend">
                  <span><span class="legend-mark up">▲</span><span class="legend-mark down">▼</span> 큰 움직임 + 뉴스</span>
                  <span><span class="legend-mark" style="color:var(--accent)">●</span> 뉴스</span>
                </p>
                <div class="seg" role="group" aria-label="기간" id="range" style="margin-left:auto">
                  <button aria-pressed="false" data-range="1M">1M</button>
                  <button aria-pressed="true" data-range="3M">3M</button>
                  <button aria-pressed="false" data-range="6M">6M</button>
                  <button aria-pressed="false" data-range="ALL">전체</button>
                </div>
              </div>
              <div class="chart-box" id="chart" role="img"
                aria-label="일봉 차트. 표시된 날짜를 누르면 그날의 뉴스를 볼 수 있습니다. 아래 목록으로도 선택할 수 있습니다."></div>
              <div class="moves">
                <h3 class="moves-title">뉴스와 함께 크게 움직인 날 (±3%)</h3>
                <ul class="chips" id="moves"></ul>
              </div>
            </section>

            <section class="panel news-panel" aria-labelledby="news-title">
              <div class="panel-head">
                <h2 class="panel-title" id="news-title">최신 뉴스</h2>
                <button class="btn ghost sm" id="news-reset" type="button" hidden style="margin-left:auto">최신 뉴스</button>
              </div>
              <p class="day-info mono" id="day-info" hidden></p>
              <div class="news-scroll" aria-live="polite"><ul id="news"></ul></div>
            </section>
          </div>

          <p class="xs muted" id="stock-source" style="margin-top:16px"></p>
        </div>
      </main>
      <footer id="footer"></footer>
    </div>
  </div>
</body>
</html>
