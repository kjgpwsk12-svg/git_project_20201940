<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMaxYMax slice">
  <!-- 설산: 아침 하늘, 겹겹의 능선, 안개 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa7c9"/>
      <stop offset="0.55" stop-color="#c3d6e6"/>
      <stop offset="1" stop-color="#e9f0f5"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.28" r="0.35">
      <stop offset="0" stop-color="#fff6e5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db5cb"/>
      <stop offset="1" stop-color="#c4d4e1"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
