    </symbol>
  </defs>

  <rect width="1600" height="600" fill="url(#sky)"/>
  <rect width="1600" height="600" fill="url(#light)"/>

  <path fill="#a9c9c4" d="M0 300 C200 260 380 290 560 250 C760 210 940 270 1140 230 C1320 195 1460 240 1600 220 L1600 600 L0 600Z"/>

  <g fill="#86aea9">
