<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMaxYMax slice">
  <!-- 밤하늘 오로라: 별, 굽이치는 빛의 띠, 어두운 능선과 호수 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061220"/>
      <stop offset="0.7" stop-color="#0e283c"/>
      <stop offset="1" stop-color="#15364b"/>
    </linearGradient>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#5eead4" stop-opacity="0.65"/>
      <stop offset="0.7" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11303f"/>
      <stop offset="1" stop-color="#071422"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glowSoft" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1600" height="600" fill="url(#sky)"/>

  <g fill="#ffffff">
    <circle cx="120" cy="60" r="1.4" opacity="0.8"/><circle cx="260" cy="130" r="1" opacity="0.6"/>
    <circle cx="400" cy="40" r="1.6" opacity="0.9"/><circle cx="560" cy="110" r="1.1" opacity="0.6"/>
    <circle cx="700" cy="70" r="1.3" opacity="0.7"/><circle cx="820" cy="30" r="1" opacity="0.6"/>
    <circle cx="950" cy="95" r="1.5" opacity="0.8"/><circle cx="1080" cy="50" r="1.2" opacity="0.7"/>
    <circle cx="1210" cy="120" r="1" opacity="0.5"/><circle cx="1340" cy="45" r="1.6" opacity="0.9"/>
    <circle cx="1470" cy="100" r="1.2" opacity="0.7"/><circle cx="1560" cy="30" r="1" opacity="0.6"/>
    <circle cx="640" cy="180" r="0.9" opacity="0.5"/><circle cx="1500" cy="190" r="0.9" opacity="0.5"/>
    <circle cx="330" cy="210" r="0.9" opacity="0.5"/><circle cx="1010" cy="160" r="0.8" opacity="0.4"/>
  </g>

  <!-- 넓게 번진 빛 -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M480 230 C640 150 780 250 940 170 S1240 110 1400 180 S1560 160 1660 120" stroke="url(#band1)" stroke-width="110"/>
    <path d="M720 120 C860 60 1000 140 1140 80 S1420 60 1660 90" stroke="url(#band2)" stroke-width="80"/>
  </g>
  <!-- 빛의 중심선 -->
  <g fill="none" stroke-linecap="round" filter="url(#glowSoft)">
    <path d="M520 235 C660 165 790 255 950 180 S1240 125 1400 190 S1560 170 1660 135" stroke="#7af5de" stroke-opacity="0.45" stroke-width="18"/>
    <path d="M760 125 C880 75 1010 145 1150 90 S1420 72 1660 100" stroke="#93c5fd" stroke-opacity="0.35" stroke-width="12"/>
  </g>

  <path fill="#0a1f30" d="M0 380 L140 330 L260 355 L380 300 L500 345 L640 290 L760 340 L900 285 L1020 335 L1160 280 L1300 330 L1440 290 L1600 320 L1600 420 L0 420Z"/>
  <rect y="420" width="1600" height="180" fill="url(#lake)"/>
  <!-- 호수에 비친 오로라 -->
  <g opacity="0.35" filter="url(#soft)">
    <ellipse cx="1050" cy="460" rx="380" ry="14" fill="#5eead4"/>
    <ellipse cx="1180" cy="490" rx="260" ry="9" fill="#60a5fa"/>
  </g>
  <path fill="#05101b" d="M0 545 C220 520 460 540 700 520 C940 500 1180 535 1420 515 C1500 509 1560 511 1600 510 L1600 600 L0 600Z"/>
</svg>
