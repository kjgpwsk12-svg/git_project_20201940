<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d1f">
    <title>구구단 만들기</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: #f5f6ff;
        background: #090d1f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow-x: hidden;
        padding: 32px 20px;
        background: radial-gradient(ellipse at 50% 40%, #121540 0%, #090b24 55%, #03040f 100%);
      }

      #sky {
        position: fixed;
        z-index: 0;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      main {
        position: relative;
        z-index: 1;
        width: min(100%, 480px);
        margin: auto;
        padding: 36px;
        border: 1px solid rgb(190 202 255 / 17%);
        border-radius: 26px;
        background: linear-gradient(145deg, rgb(24 29 62 / 66%), rgb(14 25 46 / 72%));
        box-shadow: 0 24px 80px rgb(0 0 0 / 40%), inset 0 1px rgb(255 255 255 / 6%);
        backdrop-filter: blur(18px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #a6b1ff;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 6vw, 2.1rem);
        letter-spacing: -0.05em;
        text-shadow: 0 0 28px rgb(163 175 255 / 20%);
      }

      .description {
        margin: 12px 0 28px;
        color: #b6bfd5;
        line-height: 1.6;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      label {
        grid-column: 1 / -1;
        font-size: 0.9rem;
        font-weight: 700;
        color: #e4e8f7;
      }

      input,
      button {
        min-height: 50px;
        border-radius: 12px;
        font: inherit;
      }

      input {
        width: 100%;
        padding: 0 14px;
        border: 1px solid rgb(194 205 255 / 20%);
        background: rgb(7 13 31 / 55%);
        color: #fff;
      }

      input::placeholder {
        color: #8993ad;
      }

      input:focus {
        border-color: #9aa8ff;
        outline: 3px solid rgb(139 153 255 / 20%);
      }

      button {
        padding: 0 20px;
        border: 0;
        background: linear-gradient(135deg, #8290ff, #6875ef);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 8px 20px rgb(94 105 232 / 28%);
        transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
      }

      button:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
        box-shadow: 0 11px 24px rgb(94 105 232 / 38%);
      }

      button:focus-visible {
        outline: 3px solid #c0c8ff;
        outline-offset: 3px;
      }

      .message {
        min-height: 24px;
        margin: 10px 0 0;
        color: #ffaaa9;
        font-size: 0.9rem;
      }

      .results {
        margin-top: 20px;
      }

      .results h2 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        color: #dce2ff;
      }

      .table {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        max-height: min(48vh, 390px);
        overflow-y: auto;
        padding: 2px 5px 2px 0;
      }

      .equation {
        margin: 0;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgb(186 199 255 / 9%);
        background: linear-gradient(100deg, rgb(114 127 208 / 13%), rgb(117 199 222 / 7%));
        color: #eef0ff;
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }

      .table::-webkit-scrollbar {
        width: 6px;
      }

      .table::-webkit-scrollbar-thumb {
        border-radius: 6px;
        background: rgb(174 186 255 / 35%);
      }

      @media (max-width: 420px) {
        main {
          padding: 28px 22px;
        }

        form {
          grid-template-columns: 1fr;
        }

        button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="sky" aria-hidden="true"></canvas>
    <main>
      <p class="eyebrow">MULTIPLICATION TABLE</p>
      <h1>구구단 만들기</h1>
      <p class="description">2 이상의 숫자를 입력하면 1부터 9까지의 구구단을 보여드려요.</p>

      <form id="multiplication-form" novalidate>
        <label for="number">몇 단을 볼까요?</label>
        <input
          id="number"
          name="number"
          type="text"
          inputmode="numeric"
          placeholder="2 이상의 정수 입력"
          required
          aria-describedby="message"
        >
        <button type="submit">구구단 보기</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>

      <section id="results" class="results" aria-live="polite" hidden>
        <h2 id="result-title"></h2>
        <div id="table" class="table"></div>
      </section>
    </main>

    <script>
      (() => {
        const canvas = document.querySelector("#sky");
        const ctx = canvas.getContext("2d");
        const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const rand = (a, b) => a + Math.random() * (b - a);
        const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
        const NEBULA = ["138,92,255", "78,148,255", "255,110,200", "70,220,230", "170,130,255"];
        const ARM_COLORS = [
          "255,236,200", "255,214,160", "214,200,255", "160,180,255", "130,160,255", "190,130,255",
        ];

        let w, h, dpr, nebula, nebSize, stars, galaxy, shooters = [];
        const mouse = { x: 0, y: 0, tx: 0, ty: 0 };

        function buildNebula() {
          nebSize = Math.hypot(w, h) * 1.15;
          nebula = document.createElement("canvas");
          nebula.width = nebula.height = Math.round(nebSize * 0.6);
          const n = nebula.getContext("2d");
          const S = nebula.width;
          n.globalCompositeOperation = "lighter";
          const blobs = Math.round(S / 5);
          for (let i = 0; i < blobs; i++) {
            const x = S / 2 + rand(-0.5, 0.5) * S;
            const y = S / 2 + gauss() * S * 0.07;
            const r = rand(0.05, 0.16) * S * (1 - Math.abs(x - S / 2) / S * 0.7);
            const c = NEBULA[(Math.random() * NEBULA.length) | 0];
            const g = n.createRadialGradient(x, y, 0, x, y, r);
            const a = rand(0.025, 0.07);
            g.addColorStop(0, `rgba(${c},${a})`);
            g.addColorStop(1, `rgba(${c},0)`);
            n.fillStyle = g;
            n.fillRect(x - r, y - r, r * 2, r * 2);
          }
          const core = n.createLinearGradient(0, S / 2 - S * 0.07, 0, S / 2 + S * 0.07);
          core.addColorStop(0, "rgba(200,190,255,0)");
          core.addColorStop(0.5, "rgba(225,215,255,0.07)");
          core.addColorStop(1, "rgba(200,190,255,0)");
          n.fillStyle = core;
          n.fillRect(0, S / 2 - S * 0.07, S, S * 0.14);
          n.globalCompositeOperation = "source-over";
          for (let i = 0; i < blobs / 3; i++) {
            const x = S / 2 + rand(-0.45, 0.45) * S;
            const y = S / 2 + gauss() * S * 0.025;
            const r = rand(0.02, 0.06) * S;
            const g = n.createRadialGradient(x, y, 0, x, y, r);
            g.addColorStop(0, "rgba(4,5,20,0.22)");
            g.addColorStop(1, "rgba(4,5,20,0)");
            n.fillStyle = g;
            n.fillRect(x - r, y - r, r * 2, r * 2);
          }
          n.globalCompositeOperation = "lighter";
          const dots = Math.round(S * 2.2);
          for (let i = 0; i < dots; i++) {
            const x = rand(0, S);
            const y = S / 2 + gauss() * S * 0.06;
            n.fillStyle = `rgba(255,255,255,${rand(0.15, 0.7)})`;
            n.fillRect(x, y, 1.2, 1.2);
          }
        }

        function buildStars() {
          const count = Math.round(Math.min(900, (w * h) / 2600));
          stars = Array.from({ length: count }, () => {
            const depth = Math.random();
            return {
              x: Math.random(), y: Math.random(),
              r: 0.4 + depth * 1.3,
              depth,
              phase: rand(0, 6.28),
              speed: rand(0.6, 2.4),
              color: Math.random() < 0.25 ? "170,200,255" : Math.random() < 0.3 ? "255,225,200" : "255,255,255",
              spark: depth > 0.93,
            };
          });
        }

        function buildGalaxy() {
          const R = Math.max(w, h) * 0.46;
          const count = w * h < 500000 ? 3500 : 6500;
          const buckets = ARM_COLORS.map(() => []);
          for (let i = 0; i < count; i++) {
            const rn = Math.pow(Math.random(), 1.5);
            const r = rn * R;
            const arm = i % 2 ? Math.PI : 0;
            const theta = arm + rn * 5.2 + gauss() * (0.55 - rn * 0.25);
            const spread = gauss() * R * 0.025 * (1 - rn * 0.5);
            const idx = Math.min(ARM_COLORS.length - 1, Math.max(0, Math.floor((rn + gauss() * 0.12) * ARM_COLORS.length)));
            buckets[idx].push({ r: r + spread, rn, theta, s: rand(0.7, 1.9) * (1.15 - rn * 0.4), a: rand(0.35, 1) });
          }
          galaxy = {
            R, buckets,
            x: w * (w < 700 ? 0.5 : 0.62), y: h * (w < 700 ? 0.3 : 0.4),
            tilt: -0.5, flat: 0.42,
          };
        }

        function resize() {
          dpr = Math.min(devicePixelRatio || 1, 2);
          w = innerWidth; h = innerHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          buildNebula(); buildStars(); buildGalaxy();
          if (reduceMotion) frame(0);
        }

        function drawGalaxy(t, px, py) {
          const { R, buckets, x: gx, y: gy, tilt, flat } = galaxy;
          const ct = Math.cos(tilt), st = Math.sin(tilt);
          const cx = gx + px * 14, cy = gy + py * 14;
          let g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 0.9);
          g.addColorStop(0, "rgba(150,120,255,0.16)");
          g.addColorStop(0.45, "rgba(90,110,255,0.06)");
          g.addColorStop(1, "rgba(60,80,255,0)");
          ctx.save();
          ctx.translate(cx, cy); ctx.rotate(tilt); ctx.scale(1, flat * 1.35);
          ctx.fillStyle = g;
          ctx.fillRect(-R, -R, R * 2, R * 2);
          ctx.restore();
          ctx.globalCompositeOperation = "lighter";
          buckets.forEach((list, b) => {
            ctx.fillStyle = `rgb(${ARM_COLORS[b]})`;
            for (const p of list) {
              const ang = p.theta + t * 0.05 / (0.25 + p.rn);
              const lx = Math.cos(ang) * p.r, ly = Math.sin(ang) * p.r * flat;
              ctx.globalAlpha = p.a;
              ctx.fillRect(cx + lx * ct - ly * st, cy + lx * st + ly * ct, p.s, p.s);
            }
          });
          ctx.globalAlpha = 1;
          const pulse = 0.85 + 0.15 * Math.sin(t * 1.3);
          g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.17);
          g.addColorStop(0, `rgba(255,244,225,${0.85 * pulse})`);
          g.addColorStop(0.3, `rgba(255,208,160,${0.35 * pulse})`);
          g.addColorStop(1, "rgba(255,170,120,0)");
          ctx.fillStyle = g;
          ctx.fillRect(cx - R * 0.17, cy - R * 0.17, R * 0.34, R * 0.34);
        }

        function drawStars(t, px, py) {
          for (const s of stars) {
            const tw = 0.55 + 0.45 * Math.sin(t * s.speed + s.phase);
            const x = s.x * w + px * s.depth * 22;
            const y = s.y * h + py * s.depth * 22;
            ctx.fillStyle = `rgba(${s.color},${(0.25 + 0.75 * tw) * (0.4 + s.depth * 0.6)})`;
            ctx.beginPath();
            ctx.arc(x, y, s.r * (0.8 + 0.3 * tw), 0, 6.283);
            ctx.fill();
            if (s.spark) {
              const L = 7 + 6 * tw;
              ctx.strokeStyle = `rgba(${s.color},${0.35 * tw})`;
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              ctx.moveTo(x - L, y); ctx.lineTo(x + L, y);
              ctx.moveTo(x, y - L); ctx.lineTo(x, y + L);
              ctx.stroke();
            }
          }
        }

        let nextShooter = 1.5;
        function drawShooters(t, dt) {
          if (t > nextShooter) {
            nextShooter = t + rand(2.5, 6);
            const ang = rand(0.35, 0.65);
            shooters.push({
              x: rand(0, w * 0.8), y: rand(0, h * 0.4),
              vx: Math.cos(ang) * rand(700, 1100), vy: Math.sin(ang) * rand(700, 1100),
              life: 0, max: rand(0.7, 1.2), len: rand(100, 200),
            });
          }
          shooters = shooters.filter((s) => s.life < s.max);
          for (const s of shooters) {
            s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
            const k = 1 - s.life / s.max;
            const m = Math.hypot(s.vx, s.vy);
            const tx = s.x - (s.vx / m) * s.len, ty = s.y - (s.vy / m) * s.len;
            const g = ctx.createLinearGradient(tx, ty, s.x, s.y);
            g.addColorStop(0, "rgba(150,170,255,0)");
            g.addColorStop(1, `rgba(255,255,255,${k})`);
            ctx.strokeStyle = g; ctx.lineWidth = 1.8; ctx.lineCap = "round";
            ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(s.x, s.y); ctx.stroke();
            ctx.fillStyle = `rgba(255,255,255,${k})`;
            ctx.beginPath(); ctx.arc(s.x, s.y, 1.8, 0, 6.283); ctx.fill();
          }
        }

        let last = 0;
        function frame(ms) {
          const t = ms / 1000, dt = Math.min(0.05, Math.max(0.001, t - last));
          last = t;
          mouse.x += (mouse.tx - mouse.x) * 0.05;
          mouse.y += (mouse.ty - mouse.y) * 0.05;
          const px = mouse.x, py = mouse.y;
          ctx.globalCompositeOperation = "source-over";
          ctx.clearRect(0, 0, w, h);

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = 0.8 + 0.2 * Math.sin(t * 0.35);
          ctx.translate(w / 2 + px * 26, h / 2 + py * 26);
          ctx.rotate(-0.47 + Math.sin(t * 0.06) * 0.03);
          ctx.drawImage(nebula, -nebSize / 2, -nebSize / 2, nebSize, nebSize);
          ctx.restore();

          drawGalaxy(t, px, py);
          ctx.globalCompositeOperation = "source-over";
          drawStars(t, px, py);
          if (!reduceMotion) drawShooters(t, dt);
        }

        function loop(ms) {
          frame(ms);
          if (!document.hidden) requestAnimationFrame(loop);
        }

        addEventListener("resize", resize);
        addEventListener("pointermove", (e) => {
          mouse.tx = e.clientX / w - 0.5;
          mouse.ty = e.clientY / h - 0.5;
        });
        document.addEventListener("visibilitychange", () => {
          if (!document.hidden && !reduceMotion) requestAnimationFrame(loop);
        });
        resize();
        if (!reduceMotion) requestAnimationFrame(loop);
      })();

      const form = document.querySelector("#multiplication-form");
      const input = document.querySelector("#number");
      const message = document.querySelector("#message");
      const results = document.querySelector("#results");
      const resultTitle = document.querySelector("#result-title");
      const table = document.querySelector("#table");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const value = input.value.trim();
        if (!/^\d+$/.test(value) || BigInt(value) < 2n) {
          message.textContent = "2 이상의 정수를 입력해 주세요.";
          results.hidden = true;
          input.focus();
          return;
        }

        const dan = BigInt(value);
        message.textContent = "";
        resultTitle.textContent = `${dan}단`;
        table.replaceChildren(
          ...Array.from({ length: 9 }, (_, index) => {
            const multiplier = BigInt(index + 1);
            const equation = document.createElement("p");
            equation.className = "equation";
            equation.textContent = `${dan} × ${multiplier} = ${dan * multiplier}`;
            return equation;
          }),
        );
        results.hidden = false;
      });
    </script>
  </body>
</html>
